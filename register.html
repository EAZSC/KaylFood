<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ro‘yxatdan o‘tish — KaylFood</title>
    <meta name="description" content="KaylFood platformasida yangi mijoz sifatida ro‘yxatdan o‘tish." />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="register">
    <header id="site-header"></header>

    <main class="section-block">
      <div class="container" style="max-width:560px;">
        <div class="modal-card animate-enter" style="max-height:none;">
          <span class="hero-kicker">YANGI HISOB YARATISH</span>
          <h1 style="font-size:1.65rem;margin-top:4px;margin-bottom:8px;">Mijoz sifatida ro‘yxatdan o‘tish</h1>
          <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:20px;">
            Buyurtmalarni tezkor rasmiylashtirish va manzillarni saqlash uchun ma’lumotlaringizni kiriting.
          </p>

          <form id="register-form" novalidate>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="form-group">
                <label class="form-label" for="reg-first-name">Ism (First name)</label>
                <input
                  type="text"
                  id="reg-first-name"
                  class="form-input"
                  placeholder="Masalan: Jasur"
                  required
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="reg-last-name">Familiya (Last name)</label>
                <input
                  type="text"
                  id="reg-last-name"
                  class="form-input"
                  placeholder="Masalan: Alimov"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-phone">Telefon raqam (Phone number)</label>
              <input
                type="tel"
                id="reg-phone"
                class="form-input"
                placeholder="+998 90 123 45 67"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-password">Parol (Password)</label>
              <div class="password-field-wrap">
                <input
                  type="password"
                  id="reg-password"
                  class="form-input"
                  placeholder="Kamida 6 ta belgi"
                  required
                />
                <button type="button" class="password-toggle-btn" data-toggle-password="reg-password">
                  Ko‘rsatish
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-confirm-password">Parolni tasdiqlang (Confirm password)</label>
              <div class="password-field-wrap">
                <input
                  type="password"
                  id="reg-confirm-password"
                  class="form-input"
                  placeholder="Parolni qayta kiriting"
                  required
                />
                <button type="button" class="password-toggle-btn" data-toggle-password="reg-confirm-password">
                  Ko‘rsatish
                </button>
              </div>
            </div>

            <div id="register-error" class="form-error" role="alert"></div>

            <button type="submit" class="btn btn-glass-primary btn-block btn-lg" style="margin-top:8px;">
              Ro‘yxatdan o‘tish
            </button>
          </form>

          <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border-hairline);text-align:center;">
            <span style="font-size:0.875rem;color:var(--text-secondary);">Allaqachon hisobingiz bormi?</span>
            <a href="login.html" style="color:var(--primary-blue);font-weight:700;margin-left:6px;">Tizimga kirish</a>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
